<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" preserveAspectRatio="none">
  <defs>
    <pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#f7f6ff"/>
      <g fill="#e9e7ff" opacity="0.9">
        <circle cx="20" cy="20" r="6" />
        <circle cx="100" cy="100" r="8" />
        <rect x="50" y="50" width="20" height="20" rx="4"/>
      </g>
      <g fill="#d6d3ff" opacity="0.6">
        <circle cx="60" cy="80" r="3" />
        <circle cx="90" cy="30" r="4" />
      </g>
    </pattern>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#f6f5ff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#p)" />
  <g id="pattern" transform="translate(0,0)">
    <rect width="100%" height="100%" fill="url(#g)" opacity="0.6"/>
    <!-- soft overlapping blobs -->
    <ellipse cx="480" cy="60" rx="120" ry="60" fill="#f0efff" opacity="0.9"/>
    <ellipse cx="520" cy="200" rx="140" ry="80" fill="#ecebff" opacity="0.7"/>
    <ellipse cx="420" cy="320" rx="100" ry="50" fill="#f6f5ff" opacity="0.8"/>
  </g>
</svg>
