<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#7de3ce" stop-opacity="0.45" />
      <stop offset="1" stop-color="#5ebfc2" stop-opacity="0.25" />
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="transparent" />
      <circle cx="8" cy="8" r="2.2" fill="#9be8d9" opacity="0.18"/>
      <circle cx="40" cy="40" r="1.8" fill="#8dd6c8" opacity="0.12"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
    <style><![CDATA[
      .r{fill:url(#g1);opacity:0.12}
      .line{stroke:#7de3ce;stroke-opacity:0.06;stroke-width:2}
    ]]></style>
  </defs>
  <g id="pattern">
    <rect width="1200" height="720" fill="url(#dots)"/>
    <g filter="url(#soft)">
      <ellipse cx="160" cy="120" rx="140" ry="60" class="r"/>
      <ellipse cx="980" cy="540" rx="220" ry="80" class="r"/>
    </g>
    <g stroke-linecap="round">
      <path class="line" d="M40 220 C220 180, 420 260, 600 220" fill="none"/>
      <path class="line" d="M300 520 C520 460, 700 640, 980 560" fill="none"/>
    </g>
  </g>
</svg>