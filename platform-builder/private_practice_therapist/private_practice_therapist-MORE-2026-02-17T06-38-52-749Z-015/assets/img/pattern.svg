<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" id="pattern">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#eaf7f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="p1" patternUnits="userSpaceOnUse" width="80" height="80">
      <rect width="80" height="80" fill="url(#g1)" />
      <path d="M0 40 C10 30,30 30,40 40 S70 50,80 40" stroke="#7aa6a6" stroke-width="1" fill="none" opacity="0.12"/>
      <circle cx="12" cy="12" r="6" fill="#2b5f5f" opacity="0.06" />
      <circle cx="68" cy="68" r="6" fill="#2b5f5f" opacity="0.06" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#p1)" />
  <!-- Decorative shapes to create a calm grid -->
  <g opacity="0.06">
    <ellipse cx="160" cy="120" rx="120" ry="60" fill="#2b5f5f" />
    <ellipse cx="560" cy="680" rx="140" ry="80" fill="#7aa6a6" />
