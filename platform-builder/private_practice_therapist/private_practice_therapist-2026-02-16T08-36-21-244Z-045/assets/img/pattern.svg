<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none" role="img" aria-label="Decorative pattern">
  <defs>
    <pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#ffffff"/>
      <circle cx="20" cy="20" r="6" fill="#eef6ff"/>
      <circle cx="100" cy="100" r="8" fill="#f5fbff"/>
      <rect x="40" y="40" width="40" height="40" rx="6" fill="#fbfdff"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#p)" opacity="0.9"/>
</svg>