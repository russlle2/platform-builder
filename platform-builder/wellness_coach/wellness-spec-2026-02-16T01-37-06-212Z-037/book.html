<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LumenVibe Wellness Coaching — book</title>
<link rel="stylesheet" href="assets/css/styles.css"/>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <div class="brand">{{BUSINESS_NAME}}</div>
    <nav style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="programs.html">Programs</a>
      <a href="pricing.html">Pricing</a>
      <a href="book.html" class="btn"> {{PRIMARY_CTA_LABEL}} </a>
    </nav>
  </div>
</header>
<section class="hero"><div class="container">
      <div class="kicker">Book</div><h1 class="h1">Book a Breakthrough Session</h1>
      <p class="p">Reserve a time to tailor your path and clarify next steps.</p></div></section>
      <section><div class="container"><div class="card">
        <div class="kicker">Consultation request</div>
        <form style="margin-top:12px" onsubmit="return false;">
          <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
            <input placeholder="Name" style="padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:transparent;color:inherit"/>
            <input placeholder="Email" style="padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:transparent;color:inherit"/>
          </div>
          <textarea placeholder="What do you want to work on?" style="margin-top:12px;width:100%;min-height:130px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:transparent;color:inherit"></textarea>
          <button class="btn" style="margin-top:12px" type="button">Request</button>
        </form>
      </div></div></section>
<footer class="footer">
  <div class="container">
    <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div>© {{BUSINESS_NAME}}</div>
      <div>{{PHONE}} • {{EMAIL}}</div>
    </div>
  </div>
</footer>
<script src="assets/js/main.js"></script>
</body></html>
