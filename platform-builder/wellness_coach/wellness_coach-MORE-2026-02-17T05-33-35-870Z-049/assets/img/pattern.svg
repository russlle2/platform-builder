<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E8FF"/>
      <stop offset="100%" stop-color="#FFF1F6"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="url(#g1)" />
      <circle cx="10" cy="10" r="3" fill="#EAD6FF" opacity="0.9" />
      <circle cx="30" cy="30" r="2" fill="#FFD8E6" opacity="0.7" />
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <g opacity="0.18" filter="url(#soft)">
    <path d="M50,450 Q200,300 350,450 T650,450" fill="none" stroke="#FFE3F4" stroke-width="120" stroke-linecap="round"/>
    <path d="M450,150 Q300,300 150,150 T-150,150" fill="none" stroke="#F0E6FF" stroke-width="100" stroke-linecap="round"/>
  </g>
  <g transform="translate(450,80) rotate(20)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#FFF" opacity="0.6"/>
    <circle cx="0" cy="0" r="18" fill="#FDE8FF"/>
  </g>
</svg>