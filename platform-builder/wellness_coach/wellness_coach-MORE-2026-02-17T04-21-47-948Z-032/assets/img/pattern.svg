<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pg" x1="0" x2="1">
      <stop offset="0" stop-color="#f0fbf6" />
      <stop offset="1" stop-color="#fbfff9" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="t" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="t" mode="overlay" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#pg)" />
  <!-- gentle organic lines -->
  <g stroke="#dff7eb" stroke-width="10" fill="none" opacity="0.95">
    <path d="M-40 80 C 60 30, 160 120, 300 80 C 420 40, 520 120, 660 100" />
    <path d="M-40 200 C 90 160, 210 260, 360 220 C 470 190, 540 260, 660 240" />
    <path d="M-40 320 C 120 280, 240 360, 380 320 C 500 290, 580 360, 660 340" />
  </g>
  <!-- subtle dots grid -->
  <g fill="#f3fff8" opacity="0.8">
    <circle cx="40" cy="40" r="2" />
    <circle cx="120" cy="80" r="2" />
    <circle cx="200" cy="40" r="2" />
    <circle cx="280" cy="80" r="2" />
    <circle cx="360" cy="40" r="2" />
    <circle cx="440" cy="80" r="2" />
    <circle cx="520" cy="40" r="2" />
  </g>
  <rect x="0" y="0" width="100%" height="100%" fill="transparent" filter="url(#grain)" />
</svg>
