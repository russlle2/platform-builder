<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" preserveAspectRatio="none">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#d0f6e4" />
      <stop offset="1" stop-color="#f0fff8" />
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="12" height="12" fill="transparent"/>
      <circle cx="2" cy="2" r="1.4" fill="#bff0d9" />
      <circle cx="8" cy="8" r="1.2" fill="#e6fff3" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#lg)" />
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.9" />
</svg>