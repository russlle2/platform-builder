<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Forest hillside meeting sky and snow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cde7ff"/>
      <stop offset="70%" stop-color="#f2f7fb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#134e41"/>
      <stop offset="100%" stop-color="#1f6f5b"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fa28a"/>
      <stop offset="100%" stop-color="#8b6b4f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- distant clouds -->
  <g opacity="0.5" fill="#ffffff">
    <ellipse cx="210" cy="120" rx="120" ry="28"/>
    <ellipse cx="380" cy="150" rx="180" ry="36"/>
    <ellipse cx="820" cy="110" rx="160" ry="32"/>
  </g>
  <!-- sun -->
  <circle cx="1030" cy="130" r="32" fill="#f5b95c" opacity="0.9"/>
  <!-- hills -->
  <path d="M0,520 C180,440 340,420 520,470 C700,520 840,520 1200,450 L1200,800 L0,800 Z" fill="url(#moss)" opacity="0.9"/>
  <path d="M0,600 C220,520 420,540 640,590 C860,640 990,640 1200,560 L1200,800 L0,800 Z" fill="url(#hill)"/>
  <!-- trees -->
  <g fill="#0b2d26" opacity="0.85">
    <path d="M150 620 l30 -60 l30 60 l-18 0 l0 60 l-24 0 l0 -60 z"/>
    <path d="M260 640 l30 -70 l30 70 l-18 0 l0 60 l-24 0 l0 -60 z"/>
    <path d="M360 610 l26 -55 l26 55 l-16 0 l0 52 l-20 0 l0 -52 z"/>
    <path d="M470 650 l28 -65 l28 65 l-17 0 l0 55 l-22 0 l0 -55 z"/>
    <path d="M580 630 l30 -70 l30 70 l-18 0 l0 58 l-24 0 l0 -58 z"/>
    <path d="M700 645 l26 -60 l26 60 l-16 0 l0 54 l-20 0 l0 -54 z"/>
    <path d="M810 620 l24 -55 l24 55 l-14 0 l0 50 l-20 0 l0 -50 z"/>
  </g>
  <!-- snow foreground -->
  <path d="M0,720 C220,700 480,700 700,720 C900,740 1030,750 1200,740 L1200,800 L0,800 Z" fill="#ffffff" opacity="0.95"/>
</svg>