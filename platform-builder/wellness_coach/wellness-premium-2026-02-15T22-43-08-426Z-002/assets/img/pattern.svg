<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subtle dot pattern">
  <defs>
    <radialGradient id="dot-g" cx="50%" cy="50%" r="0.5">
      <stop offset="0%" stop-color="#8F7AFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8F7AFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="none"/>
  <g opacity="0.6">
    <!-- Dotted clusters -->
    <g transform="translate(80,60)">
      <circle cx="0" cy="0" r="6" fill="url(#dot-g)"/>
      <circle cx="60" cy="20" r="5" fill="url(#dot-g)"/>
      <circle cx="120" cy="-10" r="7" fill="url(#dot-g)"/>
      <circle cx="30" cy="70" r="6" fill="url(#dot-g)"/>
      <circle cx="90" cy="60" r="5" fill="url(#dot-g)"/>
    </g>
    <g transform="translate(420,120)">
      <circle cx="0" cy="0" r="7" fill="url(#dot-g)"/>
      <circle cx="50" cy="30" r="6" fill="url(#dot-g)"/>
      <circle cx="100" cy="-20" r="6" fill="url(#dot-g)"/>
      <circle cx="30" cy="70" r="5" fill="url(#dot-g)"/>
      <circle cx="120" cy="40" r="6" fill="url(#dot-g)"/>
    </g>
    <g transform="translate(680,40)">
      <circle cx="0" cy="0" r="6" fill="url(#dot-g)"/>
      <circle cx="40" cy="30" r="5" fill="url(#dot-g)"/>
      <circle cx="-30" cy="40" r="5" fill="url(#dot-g)"/>
      <circle cx="10" cy="90" r="6" fill="url(#dot-g)"/>
      <circle cx="-50" cy="70" r="5" fill="url(#dot-g)"/>
    </g>
  </g>
</svg>