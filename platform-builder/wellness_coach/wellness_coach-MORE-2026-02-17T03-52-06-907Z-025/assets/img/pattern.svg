<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <pattern id="tile" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="80" height="80" fill="#fbf7f2" />
      <g fill="none" stroke="#f1e6dd" stroke-width="2">
        <path d="M0 20 Q20 0 40 20" />
        <path d="M40 60 Q60 40 80 60" />
      </g>
      <circle cx="20" cy="60" r="2" fill="#c99156" />
      <circle cx="60" cy="20" r="2" fill="#8b5e34" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#tile)" />
  <!-- subtle center motif -->
  <g transform="translate(160,160)" opacity="0.06">
    <circle r="110" fill="#8b5e34" />
    <circle r="80" fill="#fbf7f2" />
  </g>
