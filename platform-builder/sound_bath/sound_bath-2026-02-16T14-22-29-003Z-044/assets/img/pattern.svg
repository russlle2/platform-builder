      <stop offset='1' stop-color='#fff' stop-opacity='1'/>
    </linearGradient>
    <pattern id='p' width='80' height='80' patternUnits='userSpaceOnUse'>
      <rect width='80' height='80' fill='url(#lg)'></rect>
      <g fill='none' stroke='rgba(108,92,231,0.06)' stroke-width='1'>
        <circle cx='12' cy='12' r='10'></circle>
        <circle cx='68' cy='68' r='10'></circle>
        <path d='M0 40h80' stroke='rgba(139,211,199,0.03)'></path>
      </g>
