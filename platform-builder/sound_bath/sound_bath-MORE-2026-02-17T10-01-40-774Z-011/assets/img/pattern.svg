<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" id="pattern">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#7de3c7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5fc7ff" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <circle cx="8" cy="8" r="1.6" fill="#9bead2" opacity="0.6"/>
      <circle cx="28" cy="28" r="1" fill="#7fd1ff" opacity="0.4"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)" opacity="0.06"/>
  <g filter="url(#soft)" opacity="0.08">
    <circle cx="90" cy="60" r="120" fill="#7de3c7"/>
    <circle cx="500" cy="320" r="200" fill="#5fc7ff"/>
  </g>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.06"/>
  <!-- decorative wave lines -->
  <path d="M0 300 C120 220 260 340 380 260 C480 200 620 320 720 280" stroke="#9bead2" stroke-opacity="0.06" fill="none" stroke-width="6"/>
</svg>