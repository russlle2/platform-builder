<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gA" x1="0" x2="1">
      <stop offset="0" stop-color="#efe1d3" />
      <stop offset="1" stop-color="#f7efe8" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#d8c0a3" opacity="0.18" />
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#gA)"/>
  <g filter="url(#soft)" opacity="0.85">
    <g fill="none" stroke="#b39a7e" stroke-width="3">
      <path d="M-50 300 C150 100, 350 500, 700 250"/>
      <path d="M0 500 C200 300, 420 650, 1200 300" stroke-opacity="0.6"/>
      <path d="M-80 150 C180 30, 480 240, 980 80" stroke-opacity="0.45"/>
    </g>
    <g transform="translate(80,420)" opacity="0.9">
      <circle cx="0" cy="0" r="120" fill="#f3e7dc" />
      <circle cx="0" cy="0" r="90" fill="url(#dots)" />
    </g>
    <g transform="translate(980,120)" opacity="0.9">
      <ellipse rx="90" ry="50" fill="#efe1d3"/>
    </g>
    <g transform="translate(520,320)" opacity="0.7">
      <g fill="#d8c0a3">
        <circle cx="0" cy="0" r="38"/>
        <circle cx="80" cy="-10" r="22" opacity="0.85"/>
        <circle cx="-60" cy="40" r="16" opacity="0.8"/>
      </g>
    </g>
  </g>
  <g id="bg" opacity="1">
    <rect width="100%" height="100%" fill="transparent" />
  </g>
</svg>
