<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#f8c6d8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8fe3d8" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="rgba(2,6,23,0.25)"/>
      <g fill="none" stroke="url(#g1)" stroke-width="1.1">
        <path d="M0 60 Q30 10 60 60 T120 60" opacity="0.6"/>
        <path d="M60 0 L60 120" opacity="0.25"/>
        <circle cx="90" cy="30" r="8" opacity="0.18"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#p)" />
  <!-- decorative harmonic rings -->
  <g fill="none" stroke="#ffffff22" stroke-width="2">
    <ellipse cx="900" cy="150" rx="260" ry="80" transform="rotate(-12 900 150)"/>
    <ellipse cx="950" cy="200" rx="180" ry="40" transform="rotate(-8 950 200)"/>
    <ellipse cx="300" cy="600" rx="320" ry="110" transform="rotate(14 300 600)"/>
  </g>
  <g id="pattern" />
</svg>