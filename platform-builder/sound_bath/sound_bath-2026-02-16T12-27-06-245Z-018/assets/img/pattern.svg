<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="a" x1="0" x2="1">
      <stop offset="0" stop-color="#efe6dc"/>
      <stop offset="1" stop-color="#f7efe6"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="t"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#a)"/>
  <!-- organic rings -->
  <g fill="none" stroke="#e5d7c8" stroke-opacity="0.9" stroke-width="2">
    <path d="M50 320c60-90 180-120 300-90s220 120 250 160"/>
    <path d="M20 260c80-70 200-90 320-60s220 90 240 120"/>
    <path d="M0 200c100-60 220-70 340-40s220 70 260 100"/>
  </g>
  <!-- scattered dots for texture -->
  <g fill="#d9cbb8" opacity="0.85">
    <circle cx="80" cy="60" r="4"/>
    <circle cx="140" cy="120" r="3"/>
    <circle cx="220" cy="40" r="5"/>
    <circle cx="480" cy="90" r="3"/>
    <circle cx="360" cy="200" r="4"/>
    <circle cx="540" cy="300" r="3"/>
  </g>
  <!-- subtle radial accents -->
  <radialGradient id="r" cx="30%" cy="20%" r="60%">
    <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <circle cx="140" cy="60" r="160" fill="url(#r)"/>
  <g filter="url(#grain)">
    <rect width="100%" height="100%" fill="transparent"/>
  </g>
</svg>