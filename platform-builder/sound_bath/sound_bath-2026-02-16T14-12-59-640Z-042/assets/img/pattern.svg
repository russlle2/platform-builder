<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#9adbd0" stop-opacity=".08"/>
      <stop offset="1" stop-color="#d2c4ff" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="tile" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#071018" />
      <g fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1">
        <path d="M0 20 Q60 0 120 20"/>
        <path d="M0 60 Q60 40 120 60"/>
        <path d="M0 100 Q60 80 120 100"/>
      </g>
      <g fill="url(#g1)" opacity="0.7">
        <circle cx="20" cy="20" r="6" />
        <circle cx="100" cy="80" r="4" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#tile)" />
  <!-- soft overlays to create depth -->
  <g opacity="0.06">
    <ellipse cx="300" cy="120" rx="200" ry="60" fill="#8bd3c7" />
    <ellipse cx="120" cy="420" rx="150" ry="40" fill="#c7b7ff" />
  </g>
</svg>