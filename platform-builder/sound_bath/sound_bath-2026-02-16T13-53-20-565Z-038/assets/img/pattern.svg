<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#f7f9ff" />
      <stop offset="1" stop-color="#eef8ff" />
    </linearGradient>
    <radialGradient id="rg" cx="30%" cy="20%">
      <stop offset="0" stop-color="#f6f2ff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2" fill="#e6eefc" />
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#lg)" />
  <g opacity="0.18" filter="url(#blur)">
    <ellipse cx="200" cy="180" rx="220" ry="90" fill="#cfe4ff" />
    <ellipse cx="820" cy="420" rx="280" ry="130" fill="#e8dfff" />
    <circle cx="980" cy="140" r="90" fill="#dff7ff" />
  </g>
  <g opacity="0.6">
    <path d="M0 600 C200 520 400 720 600 640 C800 560 1000 760 1200 680 L1200 800 L0 800 Z" fill="url(#rg)" />
  </g>
  <rect width="1200" height="800" fill="url(#dots)" opacity="0.06" />
  <!-- gentle wave lines -->
  <g stroke="#d5e4ff" stroke-width="1.6" opacity="0.5" fill="none">
    <path d="M0 500 Q300 420 600 480 T1200 450" />
    <path d="M0 540 Q300 460 600 520 T1200 490" opacity="0.7"/>
  </g>
</svg>