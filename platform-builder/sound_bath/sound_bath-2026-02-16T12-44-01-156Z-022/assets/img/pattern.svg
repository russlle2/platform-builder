<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">\n  <defs>\n    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="100%">\n      <stop offset="0%" stop-color="#eff8ff" stop-opacity="0.9"/>\n      <stop offset="100%" stop-color="#f4fff6" stop-opacity="0.8"/>\n    </linearGradient>\n    <pattern id="p1" width="200" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">\n      <rect width="200" height="200" fill="url(#g1)"/>\n      <g fill="none" stroke="#d0eefd" stroke-width="1">\n        <path d="M0 60 Q50 0 100 60 T200 60" opacity="0.5"/>\n        <circle cx="100" cy="100" r="36" opacity="0.07"/>\n        <circle cx="40" cy="140" r="18" opacity="0.06"/>\n      </g>\n    </pattern>\n    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">\n      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="t"/>\n      <feColorMatrix type="saturate" values="0"/>\n      <feBlend in="SourceGraphic" in2="t" mode="overlay"/>\n    </filter>\n  </defs>\n  <rect width="100%" height="100%" fill="url(#p1)"/>\n  <!-- subtle harmonic arcs to evoke sound waves -->\n  <g stroke="#e6f6ff" stroke-width="2" fill="none" opacity="0.9">\n    <path d="M-200 380 C300 120 800 640 1600 320"/>\n    <path d="M-200 460 C350 220 850 760 1600 420" opacity="0.7"/>\n    <path d="M-200 540 C400 320 900 880 1600 520" opacity="0.5"/>\n  </g>\n  <rect width="100%" height="100%" fill="transparent" filter="url(#grain)" opacity="0.05"/>\n</svg>