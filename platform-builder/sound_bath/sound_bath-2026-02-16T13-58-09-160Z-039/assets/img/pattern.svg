<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFE6D1" />
      <stop offset="100%" stop-color="#E6F5FF" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <pattern id="rings" width="200" height="200" patternUnits="userSpaceOnUse">
      <g fill="none" stroke-opacity="0.06" stroke="#000">
        <circle cx="100" cy="100" r="28" stroke-width="2" />
        <circle cx="100" cy="100" r="58" stroke-width="1.5" />
        <circle cx="100" cy="100" r="92" stroke-width="1" />
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#g1)" />
  <g opacity="0.35" filter="url(#blur)">
    <path d="M0 560 C200 480 400 640 600 560 C800 480 1000 640 1200 560 L1200 800 L0 800 Z" fill="#FFF5EF" />
    <path d="M0 120 C220 40 420 200 600 120 C780 40 980 200 1200 120 L1200 0 L0 0 Z" fill="#E9F8FF" />
  </g>

  <!-- concentric rings grid for rhythmic feel -->
  <rect width="1200" height="800" fill="url(#rings)" opacity="0.08" />

  <!-- subtle instrument motif: tuning fork shapes -->
  <g transform="translate(60,120)" fill="#FFF" opacity="0.06">
    <path d="M30 0 L46 0 C54 0 58 8 54 14 L46 36 L46 72 C46 80 38 86 30 86 C22 86 14 80 14 72 L14 36 L6 14 C2 8 6 0 14 0 Z"/>
    <use href="#" />
  </g>

  <!-- overlay radial shimmer -->
  <radialGradient id="shine" cx="0.2" cy="0.2">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="800" fill="url(#shine)" opacity="0.08" />
</svg>