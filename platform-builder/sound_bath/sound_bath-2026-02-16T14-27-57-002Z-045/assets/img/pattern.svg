<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="gradA" x1="0" x2="1">
      <stop offset="0" stop-color="#F0FCFD"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="rings" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#gradA)"/>
      <g fill="none" stroke="#D8F3F5" stroke-width="1.5">
        <circle cx="30" cy="30" r="18" opacity="0.9" />
        <circle cx="90" cy="30" r="12" opacity="0.6" />
        <circle cx="60" cy="90" r="20" opacity="0.4" />
        <path d="M0 120 L120 0" stroke="#E8FBFF" stroke-width="1" opacity="0.6"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#rings)"/>
  <!-- subtle tonal overlay -->
  <g opacity="0.06" fill="#0B3B3E">
    <circle cx="340" cy="60" r="40" />
    <circle cx="60" cy="320" r="24" />
  </g>
</svg>