<?xml version="1.0" encoding="utf-8"?>
<!-- Unique warm-earth pattern -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="40" height="40" fill="#fff7ef" />
      <circle cx="10" cy="10" r="2" fill="#b77a4a" opacity="0.2" />
      <circle cx="30" cy="30" r="3" fill="#8a5a3b" opacity="0.08" />
      <path d="M0 20 C10 10,30 30,40 20" stroke="#d9b79a" stroke-width="1" fill="none" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#p)" />
</svg>