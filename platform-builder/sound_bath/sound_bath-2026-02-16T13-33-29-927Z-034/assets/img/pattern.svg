<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" id="pattern">
  <defs>
    <linearGradient id="pg1" x1="0" x2="1">
      <stop offset="0" stop-color="#8ec5ff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#c6a0ff" stop-opacity="0.12" />
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2" fill="url(#pg1)" />
    </pattern>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="screen" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#dots)" />
  <g filter="url(#f1)" opacity="0.25">
    <ellipse cx="200" cy="160" rx="220" ry="120" fill="#7bd3d0" />
    <ellipse cx="620" cy="640" rx="240" ry="140" fill="#b9a7ff" />
    <g opacity="0.35">
      <path d="M50 700 C200 500, 600 500, 750 700" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>