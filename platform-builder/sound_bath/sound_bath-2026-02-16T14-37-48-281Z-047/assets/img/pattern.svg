<?xml version='1.0' encoding='utf-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600' id='pattern-bg'>
  <defs>
    <linearGradient id='lg' x1='0' x2='1' y1='0' y2='1'>
      <stop offset='0' stop-color='#fdeee0' stop-opacity='0.9'/>
      <stop offset='1' stop-color='#e7d3c3' stop-opacity='0.85'/>
    </linearGradient>
    <pattern id='p1' patternUnits='userSpaceOnUse' width='120' height='120'>
      <rect width='120' height='120' fill='url(#lg)'></rect>
      <g fill='none' stroke='#d6b79a' stroke-opacity='0.12' stroke-width='1'>
        <path d='M0 60 H120' />
        <path d='M60 0 V120' />
      </g>
      <g fill='#caa37a' fill-opacity='0.06'>
        <circle cx='30' cy='30' r='8'/>
        <circle cx='90' cy='90' r='6'/>
      </g>
    </pattern>
    <filter id='grain'>
      <feTurbulence baseFrequency='0.8' numOctaves='2' stitchTiles='stitch' result='t' />
      <feColorMatrix type='saturate' values='0' result='m'/>
      <feBlend in='SourceGraphic' in2='m' mode='overlay'/>
    </filter>
  </defs>
  <rect width='100%' height='100%' fill='url(#p1)'></rect>
  <g opacity='0.12'>
    <circle cx='120' cy='90' r='220' fill='#b07a52' />
    <circle cx='420' cy='420' r='200' fill='#f6eadf' />
  </g>
  <g filter='url(#grain)' opacity='0.08'>
    <rect width='100%' height='100%' fill='#fff'/>
  </g>
</svg>