<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" id="pattern">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#7a6bff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#43e3b8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>
    <pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="transparent"/>
      <g fill="url(#g1)">
        <circle cx="20" cy="20" r="12" opacity="0.85"/>
        <circle cx="90" cy="90" r="18" opacity="0.6"/>
        <rect x="48" y="48" width="24" height="24" rx="6" opacity="0.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#p)" filter="url(#soft)" opacity="0.14"/>
  <g transform="translate(120,120)" fill="none" stroke="url(#g1)" stroke-opacity="0.12" stroke-width="6">
    <path d="M100 0 C 140 80, 220 80, 260 0"/>
    <path d="M0 100 C 80 140, 80 220, 0 260"/>
    <path d="M400 340 C 360 420, 280 420, 240 340"/>
  </g>
</svg>