<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd7a8" stop-opacity="0.09" />
      <stop offset="1" stop-color="#8be6d6" stop-opacity="0.06" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b" />
    </filter>
    <pattern id="p1" patternUnits="userSpaceOnUse" width="160" height="160">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
        <circle cx="20" cy="20" r="2" />
        <circle cx="60" cy="40" r="3" />
        <circle cx="120" cy="100" r="1.6" />
        <path d="M0 80 C40 40, 120 40, 160 80" stroke-opacity="0.03" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#08121a" />
  <g filter="url(#f1)">
    <ellipse cx="300" cy="200" rx="400" ry="160" fill="url(#g1)" />
    <ellipse cx="900" cy="600" rx="450" ry="220" fill="url(#g1)" />
  </g>
  <rect width="100%" height="100%" fill="url(#p1)" opacity="0.18" />
  <!-- rhythmic arcs -->
  <g stroke="#ffffff" stroke-opacity="0.025" fill="none" stroke-width="2">
    <path d="M0 700 Q200 500 400 700 T800 700 T1200 700" />
  </g>
  <!-- delicate frequency lines -->
  <g fill="none" stroke="#8be6d6" stroke-opacity="0.025" stroke-width="1">
    <path d="M0 100 Q150 50 300 120 T600 140 T900 120 T1200 90" />
  </g>
</svg>