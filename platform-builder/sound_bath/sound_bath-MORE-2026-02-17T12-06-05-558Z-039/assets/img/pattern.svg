<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" id="pattern">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#F5EFE8"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="rings" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="url(#g1)" />
      <circle cx="20" cy="20" r="9" fill="none" stroke="#A86F3A" stroke-opacity="0.06" stroke-width="2" />
      <circle cx="20" cy="20" r="3" fill="#7A4B2A" fill-opacity="0.02" />
    </pattern>
    <filter id="grain"><feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="t"/><feColorMatrix type="saturate" values="0" in="t" result="t2"/><feBlend in="SourceGraphic" in2="t2" mode="overlay"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#rings)" />
  <g opacity="0.4" transform="translate(30,20) rotate(-12)">
    <path d="M0,320 C80,260 160,260 240,320 C320,380 400,380 480,320" fill="none" stroke="#A86F3A" stroke-width="1.2" stroke-opacity="0.06" />
  </g>
  <g opacity="0.6" transform="translate(0,0)">
    <rect x="0" y="0" width="400" height="400" fill="none" stroke="#7A4B2A" stroke-opacity="0.02"/>
  </g>
</svg>