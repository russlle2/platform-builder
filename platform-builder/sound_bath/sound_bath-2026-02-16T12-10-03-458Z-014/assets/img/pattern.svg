<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f7f3ff"/>
      <stop offset="100%" stop-color="#e8fbff"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent" />
      <circle cx="10" cy="10" r="1.6" fill="#9b7bff" opacity="0.08" />
      <circle cx="30" cy="30" r="1.6" fill="#7bdff6" opacity="0.06" />
    </pattern>
    <radialGradient id="orb" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#9b7bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7bdff6" stop-opacity="0.06"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#lg)" />
  <rect width="100%" height="100%" fill="url(#dots)" />
  <g>
    <circle cx="120" cy="200" r="140" fill="url(#orb)" />
    <circle cx="520" cy="480" r="180" fill="url(#orb)" />
    <g fill="#ffffff" opacity="0.03">
      <circle cx="360" cy="300" r="220" />
    </g>
  </g>
</svg>