<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2022" />
      <stop offset="1" stop-color="#061616" />
    </linearGradient>
    <pattern id="pat" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#g)" />
      <g fill="#8bd3c7" fill-opacity="0.06">
        <circle cx="20" cy="20" r="6" />
        <circle cx="60" cy="60" r="4" />
        <rect x="38" y="0" width="4" height="80" />
        <rect x="0" y="38" width="80" height="4" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pat)" />
  <!-- subtle concentric arcs to suggest waves -->
  <g stroke="#8bd3c7" stroke-opacity="0.03" fill="none" stroke-width="3">
    <path d="M400 0 C600 150 600 650 400 800" />
    <path d="M280 -20 C420 120 420 680 280 820" />
    <path d="M520 -10 C660 140 660 660 520 810" />
