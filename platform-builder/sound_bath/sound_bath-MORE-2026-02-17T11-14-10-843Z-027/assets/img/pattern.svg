<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#efe7dd"/>
      <stop offset="1" stop-color="#f7f1e8"/>
    </linearGradient>
    <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="url(#g)" />
      <path d="M0 20 Q10 10 20 20 T40 20" stroke="#e6d4c6" stroke-width="1.5" fill="none"/>
      <circle cx="8" cy="8" r="2.5" fill="#c9a66b" />
      <circle cx="32" cy="32" r="2" fill="#7d5a50" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#p)"/>
  <!-- subtle concentric rings for focus center -->
  <g opacity="0.06" fill="none" stroke="#7d5a50">
    <circle cx="180" cy="120" r="60" stroke-width="6" />
    <circle cx="180" cy="120" r="95" stroke-width="2" />
    <circle cx="180" cy="120" r="30" stroke-width="3" />
  </g>
</svg>