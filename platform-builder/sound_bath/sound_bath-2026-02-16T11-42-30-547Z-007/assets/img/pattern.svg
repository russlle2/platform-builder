<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#fff3e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#eef8ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="600" height="600" fill="#ffffff"/>
  <!-- soft concentric waves -->
  <g fill="none" stroke="#e6f3ff" stroke-width="6" opacity="0.7">
    <circle cx="300" cy="200" r="160"/>
    <circle cx="300" cy="200" r="120"/>
    <circle cx="300" cy="200" r="80"/>
  </g>
  <!-- floating harmonic orbs -->
  <g filter="url(#blur)" opacity="0.85">
    <ellipse cx="120" cy="420" rx="70" ry="34" fill="#fff7f3"/>
    <ellipse cx="480" cy="460" rx="48" ry="22" fill="#f2fbff"/>
    <ellipse cx="450" cy="120" rx="52" ry="26" fill="#fff7f3"/>
  </g>
  <!-- delicate lines like chimes -->
  <g stroke="#ffe6ef" stroke-width="2" opacity="0.8">
    <path d="M60 80 C120 40 180 40 240 80"/>
    <path d="M360 540 C420 500 480 500 540 540"/>
  </g>
  <!-- dots grid -->
  <g fill="#f5faff" opacity="0.9">
    <circle cx="40" cy="40" r="2"/>
    <circle cx="80" cy="120" r="1.6"/>
    <circle cx="560" cy="200" r="1.6"/>
    <circle cx="520" cy="60" r="2"/>
    <circle cx="300" cy="300" r="1.8"/>
  </g>
</svg>