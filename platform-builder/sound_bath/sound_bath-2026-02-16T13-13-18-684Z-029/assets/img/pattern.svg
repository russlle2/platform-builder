  <rect width="100%" height="100%" fill="url(#dotGrid)" />
  <g transform="translate(120,120)" opacity="0.24" fill="url(#g1)">
    <ellipse cx="200" cy="200" rx="220" ry="90" filter="url(#blurMe)" />
    <ellipse cx="420" cy="380" rx="180" ry="60" filter="url(#blurMe)" />
  </g>
  <g fill="#ffffff" fill-opacity="0.015">
    <circle cx="60" cy="500" r="140" />
    <circle cx="700" cy="120" r="90" />
    <circle cx="400" cy="700" r="120" />
  </g>
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <path d="M0 400 Q200 300 400 400 T800 400" fill="none"/>
    <path d="M0 460 Q200 560 400 460 T800 460" fill="none"/>
  </g>
