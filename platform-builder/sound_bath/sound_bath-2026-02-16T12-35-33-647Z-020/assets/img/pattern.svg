<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg1" x1="0" x2="1">
      <stop offset="0" stop-color="#9be7e4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f5fff" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="#041123"/>
  <!-- layered organic circles to suggest resonant fields -->
  <g fill="url(#lg1)" filter="url(#blur)" opacity="0.9">
    <circle cx="120" cy="80" r="90" />
    <circle cx="220" cy="240" r="140" />
    <circle cx="480" cy="120" r="110" />
    <circle cx="610" cy="330" r="160" />
    <circle cx="380" cy="420" r="100" />
  </g>
  <!-- overlay fine grid lines to imply harmonic structure -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 40 L800 40 M0 120 L800 120 M0 200 L800 200 M0 280 L800 280 M0 360 L800 360 M0 440 L800 440 M0 520 L800 520" />
    <path d="M40 0 L40 600 M120 0 L120 600 M200 0 L200 600 M280 0 L280 600 M360 0 L360 600 M440 0 L440 600 M520 0 L520 600 M600 0 L600 600" />
  </g>
  <!-- subtle waveform line across -->
  <path d="M0 300 C80 220,160 380,240 300 C320 220,400 380,480 300 C560 220,640 380,720 300" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6" stroke-linecap="round"/>
</svg>