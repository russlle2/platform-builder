<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#6ce6ff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#93f3d6" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="g2" cx="30%" cy="30%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g2)"/>
  <!-- overlapping soft circles to suggest sound ripples -->
  <g filter="url(#blur)" fill="url(#g1)">
    <circle cx="220" cy="200" r="180" />
    <circle cx="520" cy="120" r="120" />
    <circle cx="980" cy="260" r="240" />
    <circle cx="1380" cy="180" r="140" />
  </g>
  <!-- a minimal grid of lines for texture -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <path d="M0 560 L1600 40" />
    <path d="M0 520 L1600 0" />
  </g>
  <!-- subtle wave lines -->
  <g stroke="#93f3d6" stroke-opacity="0.06" stroke-width="2" fill="none">
    <path d="M0 350 C200 300 400 420 600 350 S1000 300 1600 350"/>
    <path d="M0 400 C250 360 450 480 700 400 S1100 360 1600 400"/>
  </g>
</svg>
