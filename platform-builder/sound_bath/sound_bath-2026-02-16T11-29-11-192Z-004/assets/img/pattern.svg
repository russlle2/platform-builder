<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="pgrad" x1="0" x2="1">
      <stop offset="0" stop-color="#2cfff0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb6ee" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="transparent"/>
      <circle cx="8" cy="8" r="1.8" fill="url(#pgrad)"/>
      <circle cx="32" cy="32" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M0 60 L60 0" stroke="#ffffff" stroke-opacity="0.02"/>
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch" result="t"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="t" mode="overlay"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <g transform="translate(40,40)" opacity="0.14">
    <circle cx="40" cy="40" r="68" fill="url(#pgrad)"/>
    <circle cx="180" cy="140" r="92" fill="#111827" opacity="0.6"/>
    <g fill="#ffffff" opacity="0.04">
      <circle cx="20" cy="200" r="6"/>
      <circle cx="320" cy="60" r="8"/>
    </g>
  </g>
  <rect width="100%" height="100%" fill="transparent" filter="url(#grain)"/>
</svg>