    <path d="M50 340c60-60 180-60 240 0s180 60 240 0 180-60 240 0" fill="none" stroke="url(#b)" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M50 380c60-60 180-60 240 0s180 60 240 0 180-60 240 0" fill="none" stroke="#67d3ff" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  </g>
</svg>