  </defs>
  <rect width="900" height="600" fill="#0b0e13"/>
  <g filter="url(#blur)">
    <circle cx="180" cy="140" r="140" fill="url(#a)" opacity=".55"/>
    <circle cx="760" cy="110" r="120" fill="url(#b)" opacity=".45"/>
    <circle cx="600" cy="460" r="180" fill="url(#a)" opacity=".35"/>
