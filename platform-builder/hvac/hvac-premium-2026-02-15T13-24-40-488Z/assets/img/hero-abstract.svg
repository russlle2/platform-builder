<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Abstract airflow illustration">
  <defs>
    <linearGradient id="a" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a7acc"/>
      <stop offset="1" stop-color="#4db6ff"/>
    </linearGradient>
    <linearGradient id="b" x1="1" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffb648"/>
      <stop offset="1" stop-color="#ff8a3a"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
