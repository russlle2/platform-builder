<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#E6F8F2"/>
      <stop offset="1" stop-color="#F0F8FF"/>
    </linearGradient>
    <g id="leaf">
      <path d="M10 30 C20 10, 60 10, 70 30 C60 26, 30 26, 10 30 Z" fill="#9FDCC0" opacity="0.9"/>
      <path d="M25 28 C30 20, 50 20, 55 28" stroke="#6FBFA8" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>
  </defs>
  <rect width="100%" height="100%" fill="url(#lg)"/>
  <!-- Arrange leaves in a subtle repeating tile -->
  <g transform="translate(10,20) scale(1.2)">
    <use href="#leaf" />
  </g>
  <g transform="translate(90,60) scale(0.9) rotate(18)">
    <use href="#leaf" />
  </g>
  <g transform="translate(40,110) scale(1) rotate(-12)">
    <use href="#leaf" />
  </g>
  <g transform="translate(140,20) scale(0.8) rotate(32)">
    <use href="#leaf" />
  </g>
  <g transform="translate(120,130) scale(1.1) rotate(-28)">
    <use href="#leaf" />
  </g>
</svg>