<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="a" x1="0" x2="1">
      <stop offset="0" stop-color="#F8F6F3"/>
      <stop offset="1" stop-color="#F2F4F1"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#a)"/>
  <!-- playful, unique motif: overlapping petal grid -->
  <g fill-opacity="0.9">
    <ellipse cx="40" cy="40" rx="24" ry="14" fill="#E8F6EF" transform="rotate(-15 40 40)"/>
    <ellipse cx="80" cy="30" rx="24" ry="14" fill="#F6EDE0" transform="rotate(10 80 30)"/>
    <ellipse cx="120" cy="50" rx="24" ry="14" fill="#EDE7F6" transform="rotate(-8 120 50)"/>
    <ellipse cx="60" cy="100" rx="28" ry="16" fill="#FFF3E8" transform="rotate(6 60 100)"/>
    <ellipse cx="140" cy="120" rx="30" ry="18" fill="#EAF6F0" transform="rotate(-18 140 120)"/>
    <g fill="#D9D2C4">
      <circle cx="10" cy="180" r="2"/>
      <circle cx="30" cy="170" r="2"/>
      <circle cx="50" cy="180" r="2"/>
    </g>
  </g>
</svg>