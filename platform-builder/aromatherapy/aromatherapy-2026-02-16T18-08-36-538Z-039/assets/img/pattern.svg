<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid">
  <defs>
    <linearGradient id="lp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6f1"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#lp)" />
      <circle cx="8" cy="8" r="3" fill="#cfeee4" opacity="0.9" />
      <circle cx="56" cy="56" r="2.5" fill="#e7e0ff" opacity="0.9" />
      <path d="M0 80 L80 0" stroke="#e0f0ea" stroke-width="1.2" opacity="0.4" />
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch" result="t" />
      <feColorMatrix in="t" type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="t" mode="overlay" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
  <!-- soft circular gradients to add depth -->
  <g opacity="0.6">
    <circle cx="220" cy="180" r="140" fill="#dff6f0" />
    <circle cx="560" cy="520" r="200" fill="#efeaff" />
  </g>
  <g opacity="0.5" filter="url(#grain)">
    <rect width="100%" height="100%" fill="transparent" />
  </g>
  <!-- small icon motif: stylized drop + leaf -->
  <g transform="translate(660,80) scale(0.7)" opacity="0.25">
    <path d="M24 2 C24 2 14 14 12 22 C9 32 18 38 24 44 C30 38 39 32 36 22 C34 14 24 2 24 2 Z" fill="#7b6bff" />
    <path d="M30 26 C34 22 44 18 50 20 C56 22 64 32 62 38 C60 44 52 46 46 44 C40 42 36 36 30 26 Z" fill="#5ba28a" />
  </g>
</svg>