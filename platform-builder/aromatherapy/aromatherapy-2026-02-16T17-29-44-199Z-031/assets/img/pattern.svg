<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" id="p">
  <defs>
    <linearGradient id="pg1" x1="0" x2="1">
      <stop offset="0" stop-color="#dff6f2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0fbfb" stop-opacity="0.85"/>
