<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0%" stop-color="#F7F0FF" />
      <stop offset="100%" stop-color="#E8FFF5" />
    </linearGradient>
    <radialGradient id="rg" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent" />
      <circle cx="8" cy="8" r="2.5" fill="#E6E1F9" />
    </pattern>
    <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#lg)"/>
  <g opacity="0.6">
    <g transform="translate(80,40)">
      <path d="M0 120 C 80 0 240 0 320 120 C 400 240 560 240 640 120 L640 380 C560 260 400 260 320 380 C240 500 80 500 0 380 Z" fill="#F0E8FF" opacity="0.7"/>
    </g>
    <g transform="translate(160,180) rotate(-8)">
      <ellipse cx="200" cy="120" rx="260" ry="80" fill="url(#rg)" opacity="0.8"/>
    </g>
  </g>

  <g opacity="0.4">
    <rect x="0" y="0" width="800" height="600" fill="url(#dots)"/>
  </g>

  <g transform="translate(520,360) scale(0.9)" opacity="0.12">
    <g fill="#7C5CF0">
      <circle cx="0" cy="0" r="80"/>
      <circle cx="130" cy="-20" r="48"/>
      <circle cx="60" cy="80" r="36"/>
    </g>
  </g>

</svg>