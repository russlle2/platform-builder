<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Market — Supplies & Kits</title>
  <style>
    :root{--bg:#071419;--card:#0b1e20;--muted:#9ec6bf;--accent:#ffd199;--action:#7fe3d6}
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#e8fbf6;background-image:url('assets/img/pattern.svg');background-size:240px}
    .wrap{max-width:1100px;margin:28px auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:center}
    .brand{color:#fff;font-weight:700}
    nav a{color:var(--muted);text-decoration:none;margin-left:12px}
    .toolbar{display:flex;gap:12px;margin-top:18px;align-items:center}
    .search{flex:1}
    input,select{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
    .product{padding:12px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent)}
    .product h3{margin:0 0 6px}
    .small{font-size:13px;color:var(--muted)}
    .buy{display:inline-block;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--action);color:#013231;text-decoration:none;font-weight:700}
    .cart{position:fixed;right:18px;top:80px;width:280px;background:#061516;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
    .cart h4{margin:0 0 8px}
    .cart .item{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
    .empty{color:var(--muted)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.cart{display:none}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class='wrap'>
    <header>
      <div class='brand'>{{BUSINESS_NAME}} Market</div>
      <nav>
        <a href='index.html'>Home</a>
        <a href='services.html'>Offerings</a>
        <a href='blends.html'>Elixirs</a>
        <a href='shop.html' aria-current='page'>Market</a>
        <a href='contact.html'>Connect</a>
      </nav>
    </header>

    <div class='toolbar'>
      <div class='search' style='max-width:520px'>
        <input id='search' placeholder='Search oils, kits, or tools' aria-label='Search the market'>
      </div>
      <select id='filter'>
        <option value='all'>All notes</option>
        <option value='top'>Top</option>
        <option value='middle'>Middle</option>
        <option value='base'>Base</option>
      </select>
      <a class='buy' id='checkout' href='book.html'>Proceed to consult</a>
    </div>

    <section class='grid' id='catalog'>
      <!-- products injected by JS -->
    </section>

    <aside class='cart' id='cart'>
      <h4>Your kit</h4>
      <div id='cartList'></div>
      <div style='margin-top:8px'>
        <div class='small'>Subtotal: <strong id='subtotal'>$0</strong></div>
        <a id='finalize' class='buy' style='margin-top:8px;display:inline-block' href='book.html'>Reserve items</a>
      </div>
    </aside>

    <div style='margin-top:18px;color:var(--muted);font-size:13px'>Safety: product descriptions include recommended dilutions and patch test reminders. Some oils are not pet-safe or suitable for pregnancy; consult before purchase.</div>

  </div>

  <script>
    const products = [
      {id:1,name:'Bergamot (10ml)',note:'top',price:12,desc:'Bright citrus; use with caution on sun-exposed skin.'},
      {id:2,name:'Lavender (10ml)',note:'middle',price:10,desc:'Gentle floral; versatile for many blends.'},
      {id:3,name:'Cedarwood (10ml)',note:'base',price:11,desc:'Woody anchor; small amounts add longevity.'},
      {id:4,name:'Roller Kit (10ml)',note:'tool',price:9,desc:'Empty glass roll-ons, set of 3.'},
      {id:5,name:'Diffuser Blend Set',note:'mixed',price:28,desc:'Pre-measured blend set for a small diffuser.'},
      {id:6,name:'Frankincense (5ml)',note:'base',price:16,desc:'Resinous, grounding; use conservatively.'}
    ];

    const catalog = document.getElementById('catalog');
    const cartList = document.getElementById('cartList');
    const subtotalEl = document.getElementById('subtotal');
    const search = document.getElementById('search');
    const filter = document.getElementById('filter');

    let cart = [];

    function renderProducts(){
      const q = (search.value||'').toLowerCase();
      const f = filter.value;
      catalog.innerHTML = '';
      products.forEach(p=>{
        if(q && !(p.name.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q))) return;
        if(f!=='all' && f!=='mixed' && f!=='tool' && p.note!==f && !(f==='all')) return;
        const el = document.createElement('div');
        el.className='product';
        el.innerHTML = "<h3>"+p.name+"</h3><div class='small'>"+p.desc+"</div><div style='margin-top:8px'><strong>$"+p.price+"</strong></div><a class='buy' href='#' data-id='"+p.id+"'>Add</a>";
        catalog.appendChild(el);
      });
      // attach handlers
      document.querySelectorAll('.product .buy').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();addToCart(Number(btn.getAttribute('data-id')));}));
    }

    function addToCart(id){
      const p = products.find(x=>x.id===id);
      const found = cart.find(x=>x.id===id);
      if(found) found.qty++; else cart.push({id:p.id,name:p.name,price:p.price,qty:1});
      renderCart();
      // subtle feedback
      const btn = document.querySelector('[data-id="'+id+'"]');
      btn.textContent='Added';setTimeout(()=>btn.textContent='Add',800);
    }

    function renderCart(){
      cartList.innerHTML='';
      if(cart.length===0){cartList.innerHTML='<div class="empty">No items yet</div>';subtotalEl.textContent='$0';return}
      let total=0;
      cart.forEach(it=>{
        const row = document.createElement('div');row.className='item';
        row.innerHTML = '<div>'+it.name+' x'+it.qty+'</div><div>$'+(it.price*it.qty)+'</div>';
        cartList.appendChild(row);
        total += it.price*it.qty;
      });
      subtotalEl.textContent='$'+total;
    }

    search.addEventListener('input',renderProducts);
    filter.addEventListener('change',renderProducts);

    renderProducts();
    renderCart();

    // Deep-link: if ?blend=morning open helpful items
    const params = new URLSearchParams(location.search);
    if(params.get('blend')==='morning'){
      search.value='bergamot';renderProducts();
    }
  </script>
</body>
</html>
