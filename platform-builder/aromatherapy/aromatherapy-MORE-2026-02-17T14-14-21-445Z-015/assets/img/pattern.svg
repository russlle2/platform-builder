<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#102033" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="p1" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="transparent" />
      <g fill-opacity="0.04" fill="#fff">
        <circle cx="20" cy="20" r="10" />
        <circle cx="140" cy="140" r="10" />
        <rect x="60" y="60" width="40" height="40" rx="8" />
      </g>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#lg)"/>
  <rect width="1200" height="800" fill="url(#p1)"/>
  <g transform="translate(200,80)" opacity="0.06">
    <path d="M0 200 C150 50,350 350,500 200 C650 50,850 350,1000 200 L1000 800 L0 800 Z" fill="#fff"/>
  </g>
  <g opacity="0.04">
    <circle cx="1000" cy="120" r="220" fill="#d7c4a9" />
  </g>
</svg>