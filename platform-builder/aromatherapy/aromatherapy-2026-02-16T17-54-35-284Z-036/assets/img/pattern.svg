    <pattern id="p1" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="url(#g1)" />
      <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
        <path d="M0 0 L160 0 L160 160 L0 160 Z" />
