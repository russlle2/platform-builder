<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f6efe6"/><stop offset="1" stop-color="#fff8f2"/></linearGradient>
    <pattern id="leafPattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="rgba(255,255,255,0)" />
      <g fill="none" stroke="#e9dacf" stroke-width="1.5">
        <path d="M20 100 C40 20,120 20,140 100" opacity="0.9"/>
        <path d="M40 120 C60 40,140 40,160 120" opacity="0.6"/>
      </g>
      <g transform="translate(30,30)" fill="#e3c9b0">
        <ellipse cx="24" cy="24" rx="18" ry="10" transform="rotate(-25 24 24)"/>
        <ellipse cx="72" cy="48" rx="14" ry="8" transform="rotate(-10 72 48)"/>
      </g>
    </pattern>
    <filter id="soft"> <feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <rect width="100%" height="100%" fill="url(#leafPattern)" opacity="0.55"/>
  <!-- hand-drawn leaf motif -->
  <g fill="#b86b39" opacity="0.06" filter="url(#soft)">
    <path d="M600 200c-40 10-70 60-30 110s110 30 120 0-20-80-90-110z"/>
    <path d="M120 640c30-20 20-70-10-100s-80-20-90 10 20 90 100 120z"/>
  </g>
</svg>