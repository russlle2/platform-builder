<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gradA" x1="0" x2="1">
      <stop offset="0%" stop-color="#fffafc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f6f5fb" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="transparent"/>
      <circle cx="6" cy="6" r="2" fill="#efe9ff" opacity="0.07" />
      <path d="M0,60 L60,0" stroke="#efe9ff" stroke-width="1" opacity="0.03" />
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#gradA)"/>
  <g opacity="0.85" filter="url(#soft)">
    <g transform="translate(40,20)">
      <rect x="0" y="0" width="720" height="560" rx="28" fill="url(#dots)" />
    </g>
    <g transform="translate(480,360) rotate(-18)">
      <ellipse cx="0" cy="0" rx="260" ry="120" fill="#f0e9ff" opacity="0.045"/>
    </g>
    <g transform="translate(160,140) rotate(6)">
      <ellipse cx="0" cy="0" rx="220" ry="100" fill="#fff6f0" opacity="0.03"/>
    </g>
  </g>
</svg>