<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <pattern id="leafPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="rgba(255,255,255,0)"/>
      <g fill-opacity="0.06">
        <ellipse cx="30" cy="30" rx="22" ry="10" fill="#6aa84f" transform="rotate(-20 30 30)" />
        <ellipse cx="90" cy="90" rx="22" ry="10" fill="#4aa3c6" transform="rotate(25 90 90)" />
        <circle cx="60" cy="20" r="6" fill="#6aa84f" />
        <circle cx="20" cy="90" r="5" fill="#4aa3c6" />
      </g>
      <path d="M10 110 Q 60 70 110 110" stroke="#e6f6ee" stroke-width="2" fill="none" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#fffefc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f4fffb" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)"/>
  <rect width="100%" height="100%" fill="url(#leafPattern)" />
  <!-- playful spirals -->
  <g fill="none" stroke="#dff6ea" stroke-opacity="0.7">
    <path d="M680 120 C720 140 740 180 700 200" stroke-width="2"/>
    <path d="M720 160 C760 200 740 240 700 230" stroke-width="1.6"/>
    <path d="M120 420 C160 400 200 440 160 460" stroke-width="1.8"/>
  </g>
</svg>