<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFF6EE"/>
      <stop offset="100%" stop-color="#E8FFF6"/>
    </linearGradient>
    <pattern id="drops" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" fill-rule="evenodd">
        <circle cx="20" cy="20" r="8" fill="#F8E8D9" opacity="0.9" />
        <path d="M60 30c8 0 12-8 12-16s-6-14-12-14-12 6-12 14 4 16 12 16z" fill="#CDEEE4" opacity="0.9"/>
        <path d="M90 90c6 0 10-6 10-12s-5-10-10-10-10 4-10 10 4 12 10 12z" fill="#E6F9F4" opacity="0.6"/>
      </g>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#lg)"/>
  <rect width="1200" height="800" fill="url(#drops)" opacity="0.55"/>

  <!-- botanical strokes -->
  <g transform="translate(60,40)" fill="#A9EBD8" opacity="0.16" filter="url(#soft)">
    <path d="M30 220 C120 150 260 260 360 190 C480 110 620 300 820 220" stroke="#8CD8C8" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>

  <!-- leaf motifs -->
  <g fill="#D7F4EC" opacity="0.7" transform="translate(40,20)">
    <ellipse cx="980" cy="100" rx="40" ry="18"/>
    <ellipse cx="1040" cy="130" rx="32" ry="14"/>
  </g>

  <!-- droplets cluster -->
  <g transform="translate(160,480)" fill="#FBEFE1" opacity="0.85">
    <ellipse cx="0" cy="0" rx="28" ry="36"/>
    <ellipse cx="42" cy="-8" rx="14" ry="20"/>
    <ellipse cx="-36" cy="10" rx="16" ry="22"/>
  </g>

  <!-- subtle overlay shape -->
  <path d="M0 600 C160 520 420 760 700 640 C980 520 1200 720 1200 800 L0 800 Z" fill="#F3FFF8" opacity="0.6"/>
</svg>