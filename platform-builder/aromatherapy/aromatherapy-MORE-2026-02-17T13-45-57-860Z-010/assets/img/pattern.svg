<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#f7fbf8"/>
      <stop offset="1" stop-color="#eef6ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#g1)"/>
  <!-- layered, soft botanical-inspired shapes -->
  <g fill-opacity="0.12" fill="#4a7c59">
    <ellipse cx="180" cy="120" rx="260" ry="80" transform="rotate(-10 180 120)" />
    <ellipse cx="420" cy="220" rx="320" ry="90" transform="rotate(-8 420 220)" />
    <ellipse cx="1000" cy="100" rx="260" ry="70" transform="rotate(12 1000 100)" />
  </g>
  <g fill-opacity="0.06" fill="#7aa68a">
    <circle cx="920" cy="540" r="220" />
    <circle cx="600" cy="420" r="140" />
    <circle cx="260" cy="540" r="180" />
  </g>
  <!-- subtle grid of dots -->
  <g fill="#2f5d3f" fill-opacity="0.05">
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" />
    </pattern>
    <rect width="1200" height="800" fill="url(#dots)" />
  </g>
</svg>