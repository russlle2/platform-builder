<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f7f0ff" />
      <stop offset="100%" stop-color="#e3f8ff" />
    </linearGradient>
    <pattern id="p" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="url(#lg)" />
      <g fill="rgba(15,23,36,0.02)">
        <circle cx="10" cy="10" r="3" />
        <circle cx="30" cy="30" r="3" />
      </g>
    </pattern>
    <filter id="grain">
      <feTurbulence baseFrequency="0.9" numOctaves="1" stitchTiles="stitch" result="t" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend mode="overlay" in2="SourceGraphic" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#p)" />
  <g fill="none" stroke="#7b61ff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 20 Q50 0 100 20 T200 20" />
    <path d="M0 40 Q60 20 120 40 T200 40" />
  </g>
  <g opacity="0.08">
    <circle cx="40" cy="160" r="60" fill="#63d0ff" />
    <circle cx="160" cy="40" r="50" fill="#7b61ff" />
  </g>
</svg>