<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800' viewBox='0 0 800 800' preserveAspectRatio='xMidYMid slice'>
  <defs>
    <linearGradient id='pg' x1='0' x2='1'>
      <stop offset='0' stop-color='#e7f6f1'/>
      <stop offset='1' stop-color='#f6f1ff'/>
    </linearGradient>
    <pattern id='dots' width='40' height='40' patternUnits='userSpaceOnUse'>
      <rect width='40' height='40' fill='transparent'/>
      <circle cx='6' cy='6' r='1.6' fill='rgba(20,40,32,0.06)' />
      <circle cx='32' cy='32' r='1.2' fill='rgba(90,30,80,0.04)' />
    </pattern>
    <filter id='s' x='-20%' y='-20%' width='140%' height='140%'>
      <feTurbulence baseFrequency='0.8' numOctaves='1' stitchTiles='stitch' result='t' />
      <feDisplacementMap in='SourceGraphic' in2='t' scale='6' />
    </filter>
  </defs>
  <rect width='800' height='800' fill='url(#pg)'/>
  <g opacity='0.6'>
    <g transform='translate(-120,-80) scale(1.3)' filter='url(#s)'>
      <ellipse cx='280' cy='300' rx='340' ry='120' fill='#eaf6f2' opacity='0.9'/>
      <ellipse cx='520' cy='120' rx='220' ry='90' fill='#f3effa' opacity='0.95'/>
    </g>
  </g>
  <rect width='800' height='800' fill='url(#dots)' opacity='0.85'/>
</svg>