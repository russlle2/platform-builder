<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff3f8" />
      <stop offset="100%" stop-color="#f6f8ff" />
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#6f3bff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff7ab6" stop-opacity="0.06" />
    </linearGradient>
    <pattern id="drops" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" fill-rule="evenodd">
        <ellipse cx="20" cy="20" rx="12" ry="8" fill="#fff" fill-opacity="0.12" />
        <path d="M40 10c6 6 6 14 0 20-6 6-14 6-20 0s-6-14 0-20c6-6 14-6 20 0z" fill="#6f3bff" fill-opacity="0.06"/>
        <path d="M92 50c8 8 8 18 0 26-8 8-18 8-26 0s-8-18 0-26c8-8 18-8 26 0z" fill="#ff7ab6" fill-opacity="0.04"/>
        <g transform="translate(60,70) rotate(-22)">
          <path d="M6 0c3 3 3 7 0 10-3 3-7 3-10 0S-7 3 0 0z" fill="#6f3bff" fill-opacity="0.08" />
        </g>
      </g>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />
  <rect width="100%" height="100%" fill="url(#drops)" opacity="0.9" />

  <!-- stylized leaves for aromatherapy motif -->
  <g transform="translate(80,120)" fill="none" stroke="#6f3bff" stroke-opacity="0.12" stroke-width="4">
    <path d="M10 200 C60 40,180 -20,260 60"/>
    <path d="M40 180 C110 50,240 -10,320 70"/>
  </g>

  <g transform="translate(420,380) rotate(20)" fill="none" stroke="#ff7ab6" stroke-opacity="0.08" stroke-width="3">
    <path d="M10 200 C60 40,180 -20,260 60"/>
  </g>

  <!-- subtle scent trails -->
  <g stroke="url(#g2)" stroke-linecap="round" stroke-width="14" opacity="0.08">
    <path d="M100 600 C180 540,300 520,380 460" />
    <path d="M50 480 C150 420,200 380,320 360" />
  </g>
</svg>
