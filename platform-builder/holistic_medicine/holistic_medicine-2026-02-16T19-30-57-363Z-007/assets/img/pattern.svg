<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#f6efe8"/>
      <stop offset="1" stop-color="#fff8f2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#9dbf8a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7a5a3c" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <circle cx="20" cy="20" r="1.5" fill="#e9e2d9" />
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- layered organic shapes -->
  <g opacity="0.95" filter="url(#soft)">
    <path d="M0 220 C180 160 220 20 420 80 C640 150 740 90 1000 120 C1150 140 1200 80 1200 80 L1200 600 L0 600 Z" fill="url(#g2)" opacity="0.25"/>
    <path d="M0 120 C160 40 360 60 520 120 C700 190 860 120 1100 180 L1200 200 L1200 0 L0 0 Z" fill="#f0e7de" opacity="0.6"/>
  </g>

  <!-- stylized leaves -->
  <g transform="translate(60,260) scale(0.9)" fill="#9dbf8a" opacity="0.9">
    <path d="M20 0 C40 20 60 60 40 100 C20 140 -10 140 -30 100 C-50 60 -30 20 -10 0 C10 -20 10 -20 20 0 Z"/>
    <path d="M120 20 C160 60 200 110 160 160 C130 190 80 190 50 160 C10 120 30 70 60 40 C90 10 90 10 120 20 Z" opacity="0.9"/>
  </g>

  <!-- subtle grid motif -->
  <rect x="40" y="40" width="1120" height="520" fill="url(#dots)" opacity="0.08"/>

  <!-- signature mark -->
  <text x="36" y="570" font-family="Georgia,serif" font-size="12" fill="#7a5a3c">{{BUSINESS_NAME}} • pattern</text>
</svg>