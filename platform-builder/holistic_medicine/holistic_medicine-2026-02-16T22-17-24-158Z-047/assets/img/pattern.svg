<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="lg1" x1="0" x2="1">
      <stop offset="0" stop-color="#e8fff6"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <circle cx="6" cy="6" r="2" fill="#d9f3e6"/>
      <circle cx="26" cy="26" r="2" fill="#dbeeff"/>
    </pattern>
    <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.005" numOctaves="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#lg1)"/>
  <g opacity="0.9" filter="url(#wobble)">
    <path d="M-50,300 C150,120 350,480 850,300 L850,700 L-50,700 Z" fill="#f3fff9"/>
    <path d="M-50,200 C200,380 400,60 850,200 L850,0 L-50,0 Z" fill="#f0f6ff"/>
  </g>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>
  <g transform="translate(40,40)" opacity="0.7">
    <g fill="none" stroke="#cfeee6" stroke-width="2">
      <circle cx="120" cy="80" r="36"/>
      <circle cx="260" cy="160" r="52"/>
      <circle cx="420" cy="80" r="28"/>
    </g>
  </g>
</svg>