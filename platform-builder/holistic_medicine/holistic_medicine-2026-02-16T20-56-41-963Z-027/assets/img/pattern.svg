<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#7AC7B7"/>
      <stop offset="1" stop-color="#6A8CE6"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="rgba(255,255,255,0.06)" />
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <!-- soft organic waves -->
  <g opacity="0.9">
    <path d="M0 140 C120 80, 200 220, 360 160 C520 100, 680 200, 800 160 L800 400 L0 400 Z" fill="url(#lg)" opacity="0.18"/>
    <path d="M0 80 C120 20, 240 140, 400 90 C560 40, 660 140, 800 100 L800 400 L0 400 Z" fill="#C48FF0" opacity="0.06" filter="url(#blur)"/>
  </g>

  <!-- radiating subtle lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 0 L800 160" />
    <path d="M0 20 L800 180" />
    <path d="M0 40 L800 200" />
  </g>

  <!-- tiled microdots for texture -->
  <rect width="800" height="400" fill="url(#dots)" opacity="0.6"/>

  <!-- accent glyphs -->
  <g fill="#F6B57C" opacity="0.12">
    <circle cx="680" cy="60" r="36" />
    <circle cx="140" cy="320" r="24" />
  </g>
</svg>