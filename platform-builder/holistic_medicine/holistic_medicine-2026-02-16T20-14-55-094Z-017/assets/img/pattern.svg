<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#f6fff8"/>
      <stop offset="1" stop-color="#fff7ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="url(#lg)" />
      <circle cx="6" cy="6" r="1.6" fill="#e3f7ef" />
      <circle cx="18" cy="18" r="1.6" fill="#ffeefb" />
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.9" numOctaves="1" stitchTiles="stitch" result="t" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="t" mode="overlay" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <g opacity="0.12" filter="url(#grain)">
    <rect width="240" height="160" fill="#ffffff"/>
  </g>
  <g opacity="0.06">
    <path d="M0 120 C40 80 80 160 120 120 S200 80 240 120" stroke="#dff6ef" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>