<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#f0fbf6"/>
      <stop offset="1" stop-color="#e8f6ee"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#bfe9cd"/>
      <stop offset="1" stop-color="#8fbf9a"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <circle cx="6" cy="6" r="1.6" fill="#d6efe0"/>
      <circle cx="26" cy="26" r="1.6" fill="#d6efe0"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g1)"/>
  <g opacity="0.95">
    <ellipse cx="820" cy="180" rx="420" ry="260" fill="url(#g2)" filter="url(#soft)"/>
    <ellipse cx="360" cy="560" rx="260" ry="160" fill="#f9fff9" opacity="0.9"/>
    <g transform="rotate(-18 600 400)" opacity="0.12">
      <rect x="0" y="0" width="1200" height="800" fill="url(#dots)"/>
    </g>
    <g fill="#ffffff" opacity="0.06">
      <path d="M100 700 C200 500 400 500 520 700" stroke="#fff" stroke-width="2" fill="none"/>
      <path d="M200 100 C420 160 560 140 740 220" stroke="#fff" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <g transform="translate(60,40)" opacity="0.3">
    <circle cx="40" cy="40" r="36" fill="#ffffff" />
    <circle cx="120" cy="140" r="24" fill="#ffffff" />
    <circle cx="220" cy="60" r="18" fill="#ffffff" />
  </g>
</svg>