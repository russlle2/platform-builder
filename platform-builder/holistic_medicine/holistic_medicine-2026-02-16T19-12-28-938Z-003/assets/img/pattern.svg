  <g fill="#0F172A" opacity="0.06">
    <path d="M1100 20c-80 30-240 80-360 160s-200 180-260 260-120 240-80 320c40 80 160 80 260 40s220-140 320-240 200-260 180-360c-10-50-40-110-60-120z"/>
  </g>

  <text x="60" y="520" font-size="22" fill="#064E3B" font-family="Arial">A bespoke pattern for {{BUSINESS_NAME}} — calm, layered, directional.</text>
</svg>