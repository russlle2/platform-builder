<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='600' viewBox='0 0 1200 600' preserveAspectRatio='none'>
  <defs>
    <linearGradient id='g1' x1='0' x2='1'>
      <stop offset='0' stop-color='#F6FFFA'/>
      <stop offset='1' stop-color='#E6FAF0'/>
    </linearGradient>
    <pattern id='p' width='120' height='120' patternUnits='userSpaceOnUse'>
      <rect width='120' height='120' fill='transparent'/>
      <circle cx='20' cy='20' r='18' fill='#E9F4EE' opacity='0.9'/>
      <rect x='60' y='60' width='48' height='48' rx='8' fill='#F5EDE6' opacity='0.8'/>
      <path d='M0 120 L120 0' stroke='#D7F0E6' stroke-width='6' opacity='0.6' stroke-linecap='round'/>
    </pattern>
    <filter id='soft' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='b' />
      <feBlend in='SourceGraphic' in2='b' mode='normal'/>
    </filter>
  </defs>
  <rect width='1200' height='600' fill='url(#g1)' />
  <rect width='1200' height='600' fill='url(#p)' opacity='0.9' />
  <g transform='translate(900,100) rotate(-12)' opacity='0.35' filter='url(#soft)'>
    <circle cx='0' cy='0' r='220' fill='#8FD7C1'/>
  </g>
  <g transform='translate(300,420) rotate(8)' opacity='0.22' filter='url(#soft)'>
    <ellipse cx='0' cy='0' rx='300' ry='120' fill='#C9F2E0'/>
  </g>
</svg>