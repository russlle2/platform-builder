<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <defs>
    <linearGradient id="pg" x1="0" x2="1">
      <stop offset="0" stop-color="#052026" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#07283a" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="dots" width="84" height="84" patternUnits="userSpaceOnUse">
      <rect width="84" height="84" fill="url(#pg)"/>
      <g fill="#ffffff" fill-opacity="0.03">
        <circle cx="12" cy="12" r="4" />
        <circle cx="60" cy="36" r="3" />
        <circle cx="36" cy="60" r="2.5" />
      </g>
    </pattern>

    <filter id="grain">
      <feTurbulence baseFrequency="0.9" numOctaves="1" stitchTiles="stitch"/> 
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
  <g opacity="0.06">
    <path d="M0 200 C60 120 140 80 210 120 C280 160 360 140 420 100 L420 420 L0 420 Z" fill="#ffffff"/>
  </g>
  <g opacity="0.03">
    <circle cx="340" cy="70" r="80" fill="#ffffff"/>
  </g>
</svg>