<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<defs>
  <linearGradient id="lg" x1="0" x2="1">
    <stop offset="0" stop-color="#e6fff9"/>
    <stop offset="1" stop-color="#fff7ec"/>
  </linearGradient>
  <pattern id="p" width="80" height="80" patternUnits="userSpaceOnUse">
    <rect width="80" height="80" fill="url(#lg)" />
    <g fill="none" stroke="#ffffff22" stroke-width="1">
      <path d="M0 20 Q20 0 40 20 T80 20"/>
      <path d="M0 60 Q20 40 40 60 T80 60"/>
    </g>
    <g fill="#ffffff08">
      <circle cx="12" cy="12" r="4" />
      <circle cx="68" cy="68" r="6" />
    </g>
  </pattern>
  <filter id="grain">
    <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch" result="t" />
    <feColorMatrix type="saturate" values="0" />
    <feBlend in="SourceGraphic" />
  </filter>
</defs>
<rect width="100%" height="100%" fill="url(#p)"/>
<g opacity="0.18">
  <circle cx="50" cy="340" r="120" fill="#6dd3c0"/>
  <circle cx="360" cy="40" r="80" fill="#ffd3a5"/>
