<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pgrad" x1="0" x2="1">
      <stop offset="0" stop-color="#f6fff2" />
      <stop offset="1" stop-color="#eef9ff" />
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="60" height="60" fill="transparent"/>
      <circle cx="8" cy="8" r="2.2" fill="#dff2da" opacity="0.9" />
      <circle cx="40" cy="40" r="2.2" fill="#d9eefc" opacity="0.9" />
    </pattern>
    <filter id="grain"><feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="t"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#pgrad)"/>
  <g opacity="0.6">
    <rect x="-200" y="-80" width="1200" height="400" fill="url(#dots)" />
    <g transform="translate(40,120) rotate(-12)">
      <ellipse cx="220" cy="60" rx="260" ry="120" fill="#f0fff4" opacity="0.45"/>
      <ellipse cx="480" cy="160" rx="380" ry="180" fill="#eef6ff" opacity="0.35"/>
    </g>
    <g transform="translate(0,360)">
      <path d="M0 40 C120 -20, 200 120, 400 60 C620 0, 760 120, 800 60 L800 600 L0 600 Z" fill="#f9fff6" opacity="0.5"/>
    </g>
  </g>
  <!-- subtle texture -->
  <rect width="100%" height="100%" fill="none" filter="url(#grain)" opacity="0.02"/>
</svg>
