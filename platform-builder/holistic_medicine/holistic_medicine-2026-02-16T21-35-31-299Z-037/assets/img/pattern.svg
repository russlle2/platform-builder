<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#7BC6CC" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4B6CB7" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="transparent"/>
      <g fill="url(#lg)">
        <circle cx="20" cy="20" r="18" />
        <circle cx="60" cy="60" r="28" />
        <circle cx="100" cy="100" r="12" />
      </g>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#p)" filter="url(#soft)"/>
  <g fill="none" stroke="#7BC6CC" stroke-opacity="0.08" stroke-width="1.5">
    <path d="M0 300 C100 220 200 380 300 300 S500 220 600 300" />
    <path d="M0 200 C120 140 240 260 360 200 S540 140 600 200" />
  </g>
  <g opacity="0.08">
    <rect x="420" y="20" width="150" height="150" fill="#4B6CB7" rx="18" ry="18"/>
  </g>
</svg>