<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#e6fffb"/>
      <stop offset="1" stop-color="#fff8f0"/>
    </linearGradient>
  </defs>
  <rect width="280" height="280" fill="url(#g)"/>
  <!-- unique hex-dot grid -->
  <g fill="#c9efea" opacity="0.9">
    <!-- create repeating pattern of small hexagon-like clusters -->
    <g transform="translate(14,14)">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="24" cy="0" r="4"/>
      <circle cx="12" cy="20.8" r="4"/>
    </g>
    <g transform="translate(70,14)">
      <circle cx="0" cy="0" r="3.7"/>
      <circle cx="24" cy="0" r="3.7"/>
      <circle cx="12" cy="20.8" r="3.7"/>
    </g>
    <g transform="translate(140,14)">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="24" cy="0" r="4"/>
      <circle cx="12" cy="20.8" r="4"/>
    </g>
    <g transform="translate(210,14)">
      <circle cx="0" cy="0" r="3.7"/>
      <circle cx="24" cy="0" r="3.7"/>
      <circle cx="12" cy="20.8" r="3.7"/>
    </g>

    <g transform="translate(42,52)">
      <circle cx="0" cy="0" r="3.5"/>
      <circle cx="24" cy="0" r="3.5"/>
      <circle cx="12" cy="20.8" r="3.5"/>
    </g>
    <g transform="translate(112,52)">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="24" cy="0" r="4"/>
      <circle cx="12" cy="20.8" r="4"/>
    </g>
    <g transform="translate(182,52)">
      <circle cx="0" cy="0" r="3.2"/>
      <circle cx="24" cy="0" r="3.2"/>
      <circle cx="12" cy="20.8" r="3.2"/>
    </g>

    <!-- repeated pattern across the canvas -->
    <use href="#"/>
  </g>
</svg>
