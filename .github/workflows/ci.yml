name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install the repository pnpm version
        run: corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter @platform-builder/generator-app exec playwright install --with-deps chromium

      - name: Start dev server for e2e
        run: |
          pnpm --filter @platform-builder/generator-app dev > /tmp/server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
        env:
          NEXT_PUBLIC_SITE_URL: https://dailyclarity.org
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Wait for dev server
        run: |
          timeout 120 bash -c 'until curl -sSf http://localhost:3000 > /dev/null; do sleep 2; done' || {
            echo "Dev server failed to return a successful response. Server logs:"
            cat /tmp/server.log
            echo "Last HTTP response:"
            curl -sS -i http://localhost:3000 || true
            exit 1
          }

      - name: Run e2e tests (public routes only)
        run: pnpm --filter @platform-builder/generator-app exec playwright test e2e/public-routes.spec.ts
        env:
          BASE_URL: http://localhost:3000

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev-server.pid ]; then
            kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true
          fi
          pkill -f "next dev" 2>/dev/null || true

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://dailyclarity.org
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
