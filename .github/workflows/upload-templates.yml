name: Validate baseline or publish staging templates

on:
  workflow_dispatch:
    inputs:
      verification_only:
        description: 'Read-only staging connection check; skips all exports and uploads'
        required: false
        default: false
        type: boolean
      target_environment:
        description: 'Protected target; production permits baseline validation only'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      publish:
        description: 'Publish the validated catalog to Netlify Blobs'
        required: false
        default: false
        type: boolean
      force:
        description: 'Overwrite existing Blob objects (use only for an intentional replacement)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dailyclarity-template-catalog
  cancel-in-progress: false

jobs:
  verify-staging-connection:
    if: ${{ inputs.verification_only }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Reject non-staging or mixed publication requests
        shell: bash
        run: |
          if [[ "$TARGET_ENVIRONMENT" != "staging" || "$PUBLISH" == "true" ]]; then
            echo "Read-only verification accepts staging with publish=false only." >&2
            exit 1
          fi
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PUBLISH: ${{ inputs.publish }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify the staging site and database binding without writes
        run: node apps/generator-app/scripts/verify-netlify-target.mjs
        env:
          DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_EXPECTED_SITE_ID: ${{ vars.NETLIFY_EXPECTED_SITE_ID }}
          NETLIFY_EXPECTED_SITE_HOSTNAME: ${{ vars.NETLIFY_EXPECTED_SITE_HOSTNAME }}
          NETLIFY_EXPECTED_ACCOUNT_SLUG: ${{ vars.NETLIFY_EXPECTED_ACCOUNT_SLUG }}
          NETLIFY_EXPECTED_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          NETLIFY_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
  curated-catalog:
    if: ${{ !inputs.verification_only && (inputs.target_environment != 'production' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Require certified release tooling for production publication
        if: ${{ inputs.target_environment == 'production' && inputs.publish }}
        run: |
          echo "Curated templates are rollback material. Use the certified release workflow for production." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install the repository pnpm version
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @platform-builder/generator-app exec playwright install --with-deps chromium

      - name: Test the factory and publication contract
        run: |
          pnpm --filter @platform/template-factory test
          node apps/generator-app/scripts/upload-templates-to-blobs.test.mjs

      - name: Export the deterministic launch catalog
        run: >-
          pnpm --filter @platform/template-factory export:curated --
          --output "$RUNNER_TEMP/dailyclarity-curated"

      - name: Validate the exact upload plan without credentials or writes
        run: >-
          node apps/generator-app/scripts/upload-templates-to-blobs.mjs
          --dry-run
          --root "$RUNNER_TEMP/dailyclarity-curated"

      - name: Preserve the signed catalog report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dailyclarity-curated-report
          path: ${{ runner.temp }}/dailyclarity-curated/curated-report.json
          if-no-files-found: error

      - name: Verify the exact Netlify Blob target
        if: ${{ inputs.publish }}
        run: node apps/generator-app/scripts/verify-netlify-target.mjs
        env:
          DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_EXPECTED_SITE_ID: ${{ vars.NETLIFY_EXPECTED_SITE_ID }}
          NETLIFY_EXPECTED_SITE_HOSTNAME: ${{ vars.NETLIFY_EXPECTED_SITE_HOSTNAME }}
          NETLIFY_EXPECTED_ACCOUNT_SLUG: ${{ vars.NETLIFY_EXPECTED_ACCOUNT_SLUG }}
          NETLIFY_EXPECTED_SUPABASE_URL: ${{ inputs.target_environment == 'staging' && vars.STAGING_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NETLIFY_EXPECTED_SUPABASE_PROJECT_REF: ${{ inputs.target_environment == 'staging' && vars.STAGING_SUPABASE_PROJECT_REF || secrets.DAILYCLARITY_SUPABASE_PROJECT_REF }}

      - name: Publish the reviewed catalog
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          if [[ "$CATALOG_PUBLISH_ENVIRONMENT" != "$TARGET_ENVIRONMENT" ]]; then
            echo "Refusing catalog publication: environment sentinel mismatch." >&2
            exit 1
          fi
          if [[ "$TARGET_ENVIRONMENT" != "staging" ]]; then
            echo "Curated publication is staging-only; production requires full certification." >&2
            exit 1
          fi
          args=(--root "$RUNNER_TEMP/dailyclarity-curated")
          if [[ "$FORCE_UPLOAD" == "true" ]]; then
            args+=(--force)
          fi
          node apps/generator-app/scripts/upload-templates-to-blobs.mjs "${args[@]}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CATALOG_PUBLISH_ENVIRONMENT: ${{ vars.CATALOG_PUBLISH_ENVIRONMENT }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          FORCE_UPLOAD: ${{ inputs.force }}
