name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-generator:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build generator app
        run: pnpm run generator:build
      
      - name: Deploy to Netlify
        if: ${{ secrets.NETLIFY_SITE_ID != '' }}
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './apps/generator-app/.next'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Skip Netlify deploy (NETLIFY_SITE_ID not configured)
        if: ${{ secrets.NETLIFY_SITE_ID == '' }}
        run: echo "Build succeeded. Configure NETLIFY_SITE_ID secret or rely on Netlify Git deploy."
  
  deploy-client-site:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build client site
        run: pnpm run client:build
      
      - name: Deploy to Netlify
        if: ${{ secrets.NETLIFY_SITE_ID_CLIENT != '' }}
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './apps/client-template/.next'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_CLIENT }}

      - name: Skip client Netlify deploy (NETLIFY_SITE_ID_CLIENT not configured)
        if: ${{ secrets.NETLIFY_SITE_ID_CLIENT == '' }}
        run: echo "Client build succeeded. Configure NETLIFY_SITE_ID_CLIENT or deploy manually."