name: Provisioning Simulation E2E (No Stripe)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install the repository pnpm version
        run: corepack install

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @platform-builder/generator-app exec playwright install --with-deps chromium

      - run: pnpm --filter @platform-builder/generator-app exec playwright test e2e/full-funnel.spec.ts
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          ENABLE_TEST_PURCHASE: 'true'
          TEST_PURCHASE_ADMIN_SECRET: ${{ secrets.TEST_PURCHASE_ADMIN_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
