name: Read-only production deployment and settings probe

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: 'Exact current main controller SHA with successful push CI'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dailyclarity-production
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'russlle2/platform-builder' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Exercise read-only observation guards
        run: node --test apps/generator-app/scripts/production-runtime-probe.test.mjs
      - name: Observe the exact production site without changing it
        run: node apps/generator-app/scripts/production-runtime-probe.mjs
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_EXPECTED_SITE_ID: ${{ vars.NETLIFY_EXPECTED_SITE_ID }}
          NETLIFY_EXPECTED_SITE_HOSTNAME: ${{ vars.NETLIFY_EXPECTED_SITE_HOSTNAME }}
          NETLIFY_EXPECTED_ACCOUNT_SLUG: ${{ vars.NETLIFY_EXPECTED_ACCOUNT_SLUG }}
          GITHUB_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PRODUCTION_OBSERVATION_PATH: ${{ runner.temp }}/production-observation.json
      - name: Retain only the sanitized observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-observation.json
          if-no-files-found: error
          retention-days: 30
