name: Scheduled Builds

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  rebuild-sites:
    name: Rebuild All Sites
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync content
        run: pnpm run sync-content

      - name: Build generator app
        run: pnpm --filter ./apps/generator-app run build
        env:
          NODE_ENV: production

      - name: Build client template
        run: pnpm --filter ./apps/client-template run build
        env:
          NODE_ENV: production

      - name: Deploy generator to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=apps/generator-app/.next --config=infrastructure/netlify/production.toml
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Deploy client template to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=apps/client-template/.next
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_CLIENT }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  regenerate-sitemaps:
    name: Regenerate Sitemaps
    runs-on: ubuntu-latest
    needs: rebuild-sites
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate sitemaps
        run: |
          echo "Generating sitemaps for all sites..."
          # Add sitemap generation logic here
          
      - name: Upload sitemaps
        run: |
          echo "Uploading sitemaps..."
          # Add sitemap upload logic here

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: rebuild-sites
    
    steps:
      - name: Check generator app
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://yourdomain.com)
          if [ $response -eq 200 ]; then
            echo "✅ Generator app is healthy"
          else
            echo "❌ Generator app returned $response"
            exit 1
          fi

      - name: Check client template
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://template.yourdomain.com)
          if [ $response -eq 200 ]; then
            echo "✅ Client template is healthy"
          else
            echo "❌ Client template returned $response"
            exit 1
          fi

  cleanup:
    name: Cleanup Old Deployments
    runs-on: ubuntu-latest
    needs: rebuild-sites
    
    steps:
      - name: Clean old preview deployments
        run: |
          echo "Cleaning up old preview deployments..."
          # Add cleanup logic for old Netlify preview deployments

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [rebuild-sites, regenerate-sitemaps, health-check]
    
    steps:
      - name: Create summary
        run: |
          echo "## 🌙 Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All sites rebuilt successfully" >> $GITHUB_STEP_SUMMARY
          echo "✅ Sitemaps regenerated" >> $GITHUB_STEP_SUMMARY
          echo "✅ Health checks passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** $(date)" >> $GITHUB_STEP_SUMMARY
