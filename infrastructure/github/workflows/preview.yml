name: Preview Deployments

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main

env:
  NODE_VERSION: '20'

jobs:
  preview-generator:
    name: Preview Generator App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build generator app
        run: pnpm --filter ./apps/generator-app run build
        env:
          NODE_ENV: development

      - name: Deploy preview to Netlify
        uses: netlify/actions/cli@master
        id: netlify-deploy
        with:
          args: deploy --dir=apps/generator-app/.next --config=infrastructure/netlify/dev.toml
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 🚀 Preview Deployment
            
            **Generator App Preview:** ${{ steps.netlify-deploy.outputs.deploy-url }}
            
            Preview will be automatically updated on new commits.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  preview-client-template:
    name: Preview Client Template
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client template
        run: pnpm --filter ./apps/client-template run build
        env:
          NODE_ENV: development

      - name: Deploy preview to Netlify
        uses: netlify/actions/cli@master
        id: netlify-deploy-client
        with:
          args: deploy --dir=apps/client-template/.next
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_CLIENT }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 📄 Client Template Preview
            
            **Client Template Preview:** ${{ steps.netlify-deploy-client.outputs.deploy-url }}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
