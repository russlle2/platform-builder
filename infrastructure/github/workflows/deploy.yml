name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-generator:
    name: Deploy Generator App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --workspace=apps/generator-app --if-present

      - name: Run tests
        run: npm run test --workspace=apps/generator-app --if-present

      - name: Build generator app
        run: npm run build --workspace=apps/generator-app
        env:
          NODE_ENV: production

      - name: Deploy to Netlify (Production)
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=apps/generator-app/.next --config=infrastructure/netlify/production.toml
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Post deployment notification
        if: success()
        run: |
          echo "✅ Generator app deployed successfully to production"
          echo "🔗 URL: https://yourdomain.com"

  deploy-client-template:
    name: Deploy Client Template
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client template
        run: npm run build --workspace=apps/client-template
        env:
          NODE_ENV: production

      - name: Deploy to Netlify (Production)
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=apps/client-template/.next
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_CLIENT }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Post deployment notification
        if: success()
        run: |
          echo "✅ Client template deployed successfully"
