# Base Netlify Configuration
[build]
  base = "."
  command = "npm ci && npm run build --workspace=apps/generator-app"
  publish = "apps/generator-app/.next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Dev context
[context.deploy-preview]
  command = "npm ci && npm run build --workspace=apps/generator-app"

[context.branch-deploy]
  command = "npm ci && npm run build --workspace=apps/generator-app"

[[plugins]]
  package = "@netlify/plugin-nextjs"
