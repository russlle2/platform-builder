[build]
  # Monorepo: install from repo root so workspace:* deps resolve (do not set base to apps/generator-app).
  # Netlify auto-detects pnpm from pnpm-lock.yaml — no corepack needed.
  base = "/"
  # Git builds must not publish an uncertified app over the live catalogue.
  # Build hooks ignore this first guard, so the production command also checks.
  ignore = "node ./apps/generator-app/scripts/netlify-build-guard.mjs ignore"
  command = "node apps/generator-app/scripts/netlify-build-guard.mjs build && pnpm install --frozen-lockfile && pnpm run generator:build"
  publish = "apps/generator-app/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions."stripe-fulfillment"]
  # Keep pnpm's optional Sharp package links with its traced native binaries.
  included_files = ["node_modules/.pnpm/*sharp*/node_modules/@img/**"]

[context.production]
  command = "node apps/generator-app/scripts/netlify-build-guard.mjs build && pnpm install --frozen-lockfile && pnpm run generator:build"

[context.deploy-preview]
  command = "pnpm install --frozen-lockfile && pnpm run generator:build"

[context.branch-deploy]
  command = "pnpm install --frozen-lockfile && pnpm run generator:build"
