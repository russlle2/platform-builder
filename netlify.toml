[build]
  # Run from root to ensure workspace dependencies like ui-components are installed correctly
  base = "/"
  command = "pnpm install --frozen-lockfile && pnpm run generator:build"
  publish = "apps/generator-app/.next"

[build.environment]
  NODE_VERSION = "20"

[context.production]
  command = "pnpm install --frozen-lockfile && pnpm run generator:build"

[context.deploy-preview]
  command = "pnpm install --frozen-lockfile && pnpm run generator:build"

[context.branch-deploy]
  command = "pnpm install --frozen-lockfile && pnpm run generator:build"
