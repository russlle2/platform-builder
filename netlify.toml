[build]
  # Monorepo: install from repo root so workspace:* deps resolve (do not set base to apps/generator-app).
  base = "/"
  command = "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm run generator:build"
  publish = "apps/generator-app/.next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_OPTIONS = "--max-old-space-size=8192"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Strip the 302 MB template library out of every SSR function bundle so
# we stay under Netlify's 50 MB zipped function upload limit. Next.js's
# File Tracing pulls these in transitively via the niche-registry's
# fs.readFileSync calls; the bundler exclusions below drop them before
# Netlify packages the function. Patterns use `**/` prefixes so they
# match the trace's relative-from-nft.json paths regardless of depth.
[functions]
  node_bundler = "esbuild"
  included_files = [
    "!**/platform-builder/**",
    "!**/public/_templates/**",
    "!**/.next/cache/**",
    "!**/.next/diagnostics/**",
  ]

# Context-specific commands MUST also include corepack activation so pnpm is
# available — without this, Netlify production builds fail with
# "'pnpm' is not recognized" because the base [build] command is overridden.
[context.production]
  command = "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm run generator:build"

[context.deploy-preview]
  command = "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm run generator:build"

[context.branch-deploy]
  command = "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm run generator:build"
