# Generator App Deployment
[build]
  # Run from root to ensure workspace dependencies like ui-components are installed correctly
  base = "/"
  command = "npm run generator:build"
  # Next.js runtime handles the publishing directory usually, but we point to the app folder
  publish = "apps/generator-app/.next"

[build.environment]
  NODE_VERSION = "20"

# NOTE: The previous redirect rule /* -> /index.html was removed because it breaks Next.js 
# SSR routing. Next.js handles its own routing.

# Build settings for specific contexts
[context.production]
  command = "npm ci && npm run generator:build"

[context.deploy-preview]
  command = "npm ci && npm run generator:build"

[context.branch-deploy]
  command = "npm ci && npm run generator:build"
